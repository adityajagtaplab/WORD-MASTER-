<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>WORDMASTER</title>
  <link rel="stylesheet" href="style.css">

  <!-- IMPORTANT: safe loading -->
  <script src="data.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>

<div class="container">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <div id="home">
    <h1>📚 Word Master✨️</h1>
    <button onclick="playClickSound();startGame('eng-mar')">📌 English → Marathi</button>
    <button onclick="playClickSound();startGame('mar-eng')">📌 Marathi → English</button>
    <button onclick="playClickSound();openSettings()">Settings ⚙️</button>
  </div>

  <div id="quiz" class="hidden">
    <div class="top-bar">
      <span id="score">Score: 0</span>
      <span id="streak">🔥 0</span>
    </div>

    <h2 id="question"></h2>
    <div id="options"></div>

    <div class="controls">
      <button onclick="playClickSound();skipQuestion()">⏭️ Skip</button>
      <button onclick="playClickSound();showHint()">💡 Hint</button>
      <button onclick="playClickSound();goHome()">🏠 Home</button>
    </div>

    <p id="hintText"></p>
  </div>

  <!-- SETTINGS -->
  <div id="settings" class="hidden">
    <h2>Settings</h2>

    <label>
      <input type="checkbox" id="sound1Toggle" checked>
      Sound 1️
    </label>

    <br><br>

    <label>
      <input type="checkbox" id="sound2Toggle" checked>
      Sound 2️
    </label>

    <br><br>

    <label>
      <input type="checkbox" id="bgmToggle" checked>
      Music 🎵
    </label>

    <br><br>

    <label>Volume 🎚️</label><br>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">

    <br><br>

    <audio id="bgm" loop>
      <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <button onclick="goHome();playClickSound()">Back</button>
  </div>

</div>

<div class="footer">
  <div class="slide">
    ● Welcome To "WORD MASTER" ● © 2026 Aditya Jagtap ●
  </div>
</div>

</body>
</html>
